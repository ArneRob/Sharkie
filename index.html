<body class="body" id="body" onload="init(), removeItemFromLocalStorage(`backgroundBubble`)">
    <div class="fullScreen" id="fullScreen">
        <h1 class="h1SharkieHeading">Sharkie</h1>
    </div>
    <div class="canvasDiv" id="canvasDiv" width="720" height="480">
        <div class="splashScreen" id="splashScreen"></div>
        <canvas id="canvas" width="720" height="480" class="canvas">
        </canvas>
        <div class="endScreen d_none" id="endScreen"></div>
        <div class="touchButtonsLeft">
            <div class="buttonsUpDown">
                <img class="touchButtonsWidth" id="buttonUp" src="./img/everyDirection.png" alt="">
                <img class="buttonDown touchButtonsWidth" id="buttonDown" src="./img/everyDirection.png" alt="">
            </div>
            <img class="touchButtonsWidth" id="buttonPoisen" src="./img/poisenButtonNew.png" alt="">
        </div>
        <div class="touchButtonsRight">
            <img class="touchButtonsWidth" id="buttonAttack" src="./img/attackButtonImg.png" alt="">
            <div class="buttonsLeftRight">
                <img class="buttonLeft touchButtonsWidth" id="buttonLeft" src="./img/everyDirection.png" alt="">
                <img class="buttonRight touchButtonsWidth" id="buttonRight" src="./img/everyDirection.png" alt="">
            </div>
        </div>
    </div>
    </div>
    <div class="warning-message">
        <h3>Please turn youre Device</h3>
    </div>
